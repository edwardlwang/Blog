# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Edward's Blog
subtitle: "科技与生活"
description: "一个关于科技与生活的博客。"
keywords: Hexo, Blog, Technology, Life
author: Edward Wang
language: zh-CN
timezone: "Asia/Shanghai"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
# url: http://edwardlwang.github.io/edwardlwang.github.io
url: https://edwardlwang.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  # - static/**/*.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
  exclude_languages: ["mermaid"]
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""
  exclude_languages: ["mermaid"]

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
#theme: landscape
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: "git"
  #repo: https://github.com/edwardlwang/edwardlwang.github.io.git
  repo: git@github.com:edwardlwang/edwardlwang.github.io.git
  branch: main

markdown:
  plugins:
    - "@renbaoshuo/markdown-it-katex"

# Hexo-douban 配置
douban:
  # user: "254967531" # 你的豆瓣 ID（必填）
  id: "254967531" # 你的豆瓣 ID（必填，字段名为 id，建议字符串）
  builtin: false # 关闭内置页面（推荐自定义路径）
  timeout: 10000 # 请求超时时间，单位为毫秒
  song:
    enable: true # 开启音乐页面
    path: music/index.html # 音乐页面路径
    title: "我的歌单"
    quote: "音乐是灵魂的解药"
    actions:
      - do
      - wish
      - collect
    option:
  movie:
    enable: true # 开启电影页面
    path: movies/index.html # 电影页面路径（访问：你的博客/movies/）
    title: "我的影单"
    quote: "人生如戏，戏如人生"
    actions:
      - do
      - wish
      - collect
    option:
  book:
    enable: true # 开启书籍页面
    path: books/index.html # 书籍页面路径（访问：你的博客/books/）
    title: "我的书单" # 页面标题
    quote: "读书破万卷，下笔如有神" # 页面引言（可选）
    actions:
      - do
      - wish
      - collect
    option:
  game:
    enable: true # 开启游戏页面
    path: games/index.html # 游戏页面路径（访问：你的博客/games/）
    title: "我的游单" # 页面标题
    quote: "游戏也是一种体验" # 页面引言（可选）
    actions:
      - do
      - wish
      - collect
    option:

# LeetCode 提交日历（hexo-leetcode-calendar-for-butterfly 插件）
## 用法：在文章或页面里写 {% leetcode 用户名 %} 就会插入日历
## 注意：必须写在本文件（站点配置）里；写到 _config.butterfly.yml 是无效的
## 「用户名」是力扣中文站个人主页 https://leetcode.cn/u/xxxx/ 里的 xxxx，不是昵称
## 热力图全灰 → 说明你的力扣主页没有公开提交记录，去个人设置里公开即可
leetcodecalendar:
  enable: true # 是否启用；false 时所有 leetcode 标签都不渲染
  submitGap: 5 # 色阶间隔：每提交 5 次，格子颜色升高一档
  showIcon: true # 是否显示日历中间的 LeetCode logo
  color:
    # ===== 浅色模式 =====
    submitColor: "#000" # 难度栏里「已通过题数」的数字颜色
    bgColor: "#fff" # 日历背景色
    subColors: ["#ebedf0", "#bef5cb", "#85e89d", "#34d058", "#1c992f"] # 由浅到深的 5 档色阶
    # ===== 深色模式 =====
    # 博客切到夜间模式时自动换用下面这套，不需要额外配置；
    # 不写这三项就用默认值（即下面注释里的值，取自 GitHub 深色主题的热力图）
    darkSubmitColor: "#c9d1d9" # 深色下的数字颜色（默认 #c9d1d9）
    darkBgColor: "#161b22" # 深色下的日历背景色（默认 #161b22）
    darkSubColors: ["#21262d", "#0e4429", "#006d32", "#26a641", "#39d353"] # 深色下的 5 档色阶（默认 #21262d/#0e4429/#006d32/#26a641/#39d353）
